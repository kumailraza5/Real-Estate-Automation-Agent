openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Real Estate Operations Agent API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: leads
  - name: properties
  - name: clients
  - name: tasks
  - name: appointments
  - name: workflows
  - name: notifications
  - name: activity
  - name: agents
  - name: dashboard
  - name: reports

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard stats summary
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/pipeline:
    get:
      operationId: getDashboardPipeline
      tags: [dashboard]
      summary: Get lead pipeline breakdown by status
      responses:
        "200":
          description: Pipeline data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineBreakdown"

  /dashboard/recent-activity:
    get:
      operationId: getDashboardRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
