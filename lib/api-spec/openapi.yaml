      responses:
        "200":
          description: Automation activity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationActivityReport"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── DASHBOARD ──────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalLeads, activeLeads, totalProperties, totalClients, tasksToday, automationsActive, dealsClosedThisMonth, revenueThisMonth]
      properties:
        totalLeads: { type: integer }
        activeLeads: { type: integer }
        totalProperties: { type: integer }
        totalClients: { type: integer }
        tasksToday: { type: integer }
        automationsActive: { type: integer }
        dealsClosedThisMonth: { type: integer }
        revenueThisMonth: { type: number }

    PipelineBreakdown:
      type: object
      required: [stages]
      properties:
        stages:
          type: array
          items:
            type: object
            required: [status, count, value]
            properties:
              status: { type: string }
              count: { type: integer }
              value: { type: number }

    # ─── AGENT ──────────────────────────────────────────────────────────────────
    Agent:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string }
        status: { type: string }
        avatarUrl: { type: ["string", "null"] }
        createdAt: { type: string }

    AgentInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role: { type: string }
        avatarUrl: { type: string }

    AgentUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role: { type: string }
        status: { type: string }
        avatarUrl: { type: string }

    AgentPerformance:
      type: object
      required: [agentId, agentName, leadsAssigned, leadsClosed, tasksCompleted, appointmentsHeld]
      properties:
        agentId: { type: integer }
        agentName: { type: string }
        leadsAssigned: { type: integer }
        leadsClosed: { type: integer }
        tasksCompleted: { type: integer }
        appointmentsHeld: { type: integer }

    # ─── LEAD ────────────────────────────────────────────────────────────────────
    Lead:
      type: object
      required: [id, firstName, lastName, email, status, score, source, createdAt]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        status: { type: string }
        score: { type: integer }
        source: { type: string }
        budget: { type: ["number", "null"] }
