  # ─── APPOINTMENTS (CALENDAR) ─────────────────────────────────────────────────
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List all appointments
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: from
          in: query
