  /reports/team-performance:
    get:
      operationId: getTeamPerformanceReport
      tags: [reports]
      summary: Get team performance report
      responses:
        "200":
          description: Team performance data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentPerformance"

  /reports/automation-activity:
    get:
      operationId: getAutomationActivityReport
      tags: [reports]
