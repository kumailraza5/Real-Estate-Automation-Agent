  # ─── REPORTS ─────────────────────────────────────────────────────────────────
  /reports/lead-conversion:
    get:
      operationId: getLeadConversionReport
      tags: [reports]
      summary: Get lead conversion report
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
